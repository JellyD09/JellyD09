<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      /* Animasi untuk bintang berkelip */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .star-1 { animation: twinkle 3s infinite ease-in-out 0.2s; }
      .star-2 { animation: twinkle 4s infinite ease-in-out 1.5s; }
      .star-3 { animation: twinkle 2.5s infinite ease-in-out 0.5s; }
      .star-4 { animation: twinkle 3.5s infinite ease-in-out 2s; }
      .star-5 { animation: twinkle 2s infinite ease-in-out 0.8s; }

      /* Animasi untuk uap teh melayang */
      @keyframes float {
        0% { transform: translateY(0px); opacity: 0.8; }
        100% { transform: translateY(-15px); opacity: 0; }
      }
      .steam-1 { animation: float 2.5s infinite ease-in; }
      .steam-2 { animation: float 2.5s infinite ease-in 1.25s; }
    </style>
  </defs>

  <!-- Langit malam, berlapis seperti dithering -->
  <rect x="0" y="0" width="800" height="60" fill="#2b2d42" />
  <rect x="0" y="60" width="800" height="60" fill="#3d405b" />
  <rect x="0" y="120" width="800" height="60" fill="#4a3f5c" />
  <rect x="0" y="180" width="800" height="20" fill="#3a2e2a" />

  <!-- Bintang dengan class animasi -->
  <rect class="star-1" x="40" y="30" width="4" height="4" fill="#f4f1de" />
  <rect class="star-2" x="160" y="50" width="4" height="4" fill="#f4f1de" />
  <rect class="star-3" x="300" y="24" width="4" height="4" fill="#f4f1de" />
  <rect class="star-4" x="380" y="70" width="4" height="4" fill="#f4f1de" />
  <rect class="star-5" x="470" y="20" width="4" height="4" fill="#f4f1de" />

  <!-- Jendela -->
  <rect x="600" y="30" width="120" height="110" fill="#5c4b6b" />
  <rect x="608" y="38" width="104" height="94" fill="#f2cc8f" />
  <rect x="656" y="38" width="8" height="94" fill="#5c4b6b" />
  <rect x="608" y="84" width="104" height="8" fill="#5c4b6b" />
  
  <!-- Bulan sabit -->
  <rect x="620" y="50" width="16" height="16" fill="#f4f1de" />
  <rect x="628" y="50" width="12" height="12" fill="#f2cc8f" />
  <rect x="680" y="56" width="8" height="8" fill="#f4f1de" />
  <rect x="690" y="66" width="4" height="4" fill="#f4f1de" />

  <!-- Meja -->
  <rect x="520" y="150" width="240" height="10" fill="#8d6e63" />
  <rect x="528" y="160" width="8" height="40" fill="#6d4c41" />
  <rect x="744" y="160" width="8" height="40" fill="#6d4c41" />

  <!-- Tanaman dalam pot -->
  <rect x="536" y="116" width="8" height="12" fill="#6b9080" />
  <rect x="544" y="104" width="8" height="24" fill="#81b29a" />
  <rect x="552" y="112" width="8" height="16" fill="#6b9080" />
  <rect x="540" y="128" width="24" height="22" fill="#e07a5f" />
  <rect x="540" y="128" width="24" height="4" fill="#c8553d" />

  <!-- Cangkir teh dan uap dengan class animasi -->
  <rect x="700" y="124" width="20" height="26" fill="#f4f1de" />
  <rect x="720" y="130" width="6" height="12" fill="#f4f1de" />
  <rect class="steam-1" x="706" y="110" width="4" height="4" fill="#f4f1de" opacity="0" />
  <rect class="steam-2" x="712" y="102" width="4" height="4" fill="#f4f1de" opacity="0" />

  <!-- Teks -->
  <text x="40" y="92" font-family="monospace" font-size="34" font-weight="bold" fill="#f4f1de">22`Waves</text>
  <rect x="40" y="104" width="200" height="4" fill="#e07a5f" />
  <text x="40" y="136" font-family="monospace" font-size="15" fill="#e9c46a">Visual Flows, exact pixel</text>
</svg>